name: Deploy web (Cloudflare Workers)
# apps/web -> Worker `badger3000-web`. The legacy Next site stays on Netlify
# until the cutover (PRD phase 7), so this does not touch production traffic.
#   push to astro-dev  -> wrangler deploy (live on the workers.dev URL)
#   pull request       -> wrangler versions upload (preview URL, not promoted)
#   repository_dispatch (sanity-publish) / manual -> rebuild with fresh content
# Calls the package scripts, never `turbo run`: Turbo's cache doesn't know about
# Sanity content. Runtime secrets (SANITY_API_TOKEN, ...) live on
# the Worker (`wrangler secret put`), not here.
on:
  push:
    branches: [astro-dev]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".github/workflows/deploy-web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Deploys queue rather than cancel, so a half-uploaded Worker is never abandoned.
  group: deploy-web-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    # Fork PRs get no secrets; skip them rather than fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm --filter @badger3000/web run check
      - name: Build (real Sanity content; never SANITY_ALLOW_EMPTY)
        run: pnpm --filter @badger3000/web run build
        env:
          PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.PUBLIC_RECAPTCHA_SITE_KEY }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      - name: Deploy (branch push, content webhook, manual)
        if: github.event_name != 'pull_request'
        run: pnpm --filter @badger3000/web run deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload preview version (pull request)
        if: github.event_name == 'pull_request'
        run: |
          pnpm --filter @badger3000/web exec wrangler versions upload \
            --message "PR #${{ github.event.pull_request.number }} ${{ github.sha }}" | tee upload.log
          {
            echo "### Preview"
            grep -Eo 'https://[^ ]+\.workers\.dev' upload.log | head -1 || echo "see wrangler output"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
