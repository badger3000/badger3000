name: Deploy web to Cloudflare Workers
# apps/web -> Worker `badger3000-web`. The legacy Next site stays on Netlify
# until the cutover (PRD phase 7), so this does not touch production traffic.
#   push to master                  -> wrangler deploy (production)
#   push to any other branch        -> wrangler versions upload (preview URL, not promoted)
#   repository_dispatch (sanity-publish) / manual on master -> rebuild production with fresh content
#   manual on another branch        -> preview of that branch
# Calls the package scripts, never `turbo run`: Turbo's cache doesn't know about
# Sanity content. Runtime secrets (SANITY_API_TOKEN, ...) live on
# the Worker (`wrangler secret put`), not here.
on:
  push:
    branches: ["**"]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".github/workflows/deploy-web.yml"
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Production deploys queue rather than cancel, so a half-uploaded Worker is never
  # abandoned. Branch previews cancel superseded runs of the same branch.
  group: deploy-web-${{ github.ref == 'refs/heads/master' && 'production' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  deploy:
    name: ${{ github.ref == 'refs/heads/master' && 'Build and deploy to Cloudflare' || 'Build and upload preview' }}
    runs-on: ubuntu-24.04
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm --filter @badger3000/web run check
      - name: Build (real Sanity content; never SANITY_ALLOW_EMPTY)
        run: pnpm --filter @badger3000/web run build
        env:
          PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      - name: "Deploy (production - master, content webhook, manual)"
        if: github.ref == 'refs/heads/master'
        run: pnpm --filter @badger3000/web run deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload preview version (any other branch)
        if: github.ref != 'refs/heads/master'
        run: |
          pnpm --filter @badger3000/web exec wrangler versions upload \
            --message "$REF_NAME $GITHUB_SHA" | tee upload.log
          {
            echo "### Preview"
            grep -Eo 'https://[^ ]+\.workers\.dev' upload.log | head -1 || echo "see wrangler output"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          # A branch name is attacker-chosen text (it may hold $(…), quotes, `;`):
          # it reaches the shell as data through the environment, never spliced
          # into the script by ${{ }}.
          REF_NAME: ${{ github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
