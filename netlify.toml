[build]
command = "npm run build"
publish = ".next"

[build.environment]
# `engines.node` in package.json requires >=22.12 (sanity 6 / @sanity/client 8).
NODE_VERSION = "22"
NEXT_TELEMETRY_DISABLED = "1"
NODE_OPTIONS = "--max_old_space_size=1024"

# Increase build memory limit to avoid potential memory issues
[build.processing]
skip_processing = false

# Configure Netlify Functions
[functions]
node_bundler = "esbuild"
external_node_modules = ["next"]
included_files = ["next.config.mjs", ".env.local"]

# Set functions timeout appropriately
[functions.api-sitemap]
pattern = "*/api/sitemap*"
included_files = ["scripts/generate-sitemap.cjs"]
memory = 1024
timeout = 30


# Set cache headers for better performance
[[headers]]
for = "/_next/static/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/images/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Add specific headers for API routes
[[headers]]
for = "/api/*"
[headers.values]
Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
X-Content-Type-Options = "nosniff"

# Set proper headers for sitemap files - with more specific patterns
[[headers]]
for = "/sitemap*.xml"
[headers.values]
Content-Type = "application/xml"
Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
X-Content-Type-Options = "nosniff"

[[headers]]
for = "/server-sitemap.xml"
[headers.values]
Content-Type = "application/xml"
Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
X-Content-Type-Options = "nosniff"

[[plugins]]
package = "@netlify/plugin-nextjs"
